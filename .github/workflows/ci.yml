name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish single-file executable
        run: dotnet publish src/SoftwareComplianceChecker.App -p:PublishProfile=win-x64

      # Proves the primary deliverable is a runnable Windows binary, not just a build output.
      # The app is a WPF process with no console mode, so it is started and then closed rather
      # than run to completion.
      - name: Smoke test the published executable
        shell: pwsh
        run: |
          $exe = "src/SoftwareComplianceChecker.App/bin/Release/net8.0-windows/publish/win-x64/SoftwareComplianceChecker.exe"

          if (-not (Test-Path $exe)) {
            throw "Published executable not found at $exe"
          }

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20

          if ($process.HasExited) {
            throw "The application exited on its own with code $($process.ExitCode). It should have stayed open."
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "The application started and stayed running."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: warn

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: SoftwareComplianceChecker-win-x64
          path: src/SoftwareComplianceChecker.App/bin/Release/net8.0-windows/publish/win-x64/
          if-no-files-found: error

  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest

    # The solution is developed on Linux and only run on Windows. This job guards the
    # EnableWindowsTargeting setup that makes the cross-platform build work, so a change
    # that quietly breaks it is caught here rather than by the next developer.
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Verify the sample reports are current
        run: |
          if ! git diff --quiet -- samples/; then
            echo "The committed sample reports differ from the exporters' current output."
            echo "Run 'dotnet test' locally and commit the regenerated files in samples/."
            git diff --stat -- samples/
            exit 1
          fi

  release:
    name: Release on version bump
    runs-on: ubuntu-latest
    needs: [windows, linux]

    # Only a version that has passed both platforms' tests earns a release, and only
    # from main — a bump on a pull request branch must not publish anything.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v7

      - name: Read the declared version
        id: version
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)

          if [ -z "$version" ]; then
            echo "No <Version> element found in Directory.Build.props."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Declared version is $version"

      # The whole point of this job: a bump that already has a release is a no-op, so
      # every other push to main passes through silently.
      - name: Decide whether this version still needs releasing
        id: decide
        run: |
          version='${{ steps.version.outputs.version }}'

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged. Nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "v$version is not tagged yet. Releasing."
          fi

      # A tag pushed with GITHUB_TOKEN does not start another workflow, so pushing one
      # here would silently never build. The release workflow is dispatched directly
      # instead, and it creates the tag itself as part of publishing.
      - name: Dispatch the release workflow
        if: steps.decide.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml -f version='${{ steps.version.outputs.version }}'
